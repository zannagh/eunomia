org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Cap concurrent workers. With parallel=true, Gradle would otherwise run one task per core
# (10+ on CI/dev), and each neoforge :createMinecraftArtifacts forks a memory-hungry
# decompile/recompile JVM (Vineflower + AutoRenamingTool + javac over ~7300 MC sources). A
# toolchain bump (e.g. the net.neoforged.moddev version) invalidates the NFRT cache for ALL
# neoforge variants at once, so a full build then re-decompiles every variant simultaneously.
# Unbounded, that peaks well past 16G and OOM-kills the build (exit 137) / starves the CI runner.
# Four keeps the peak near ~10-12G while staying reasonably parallel; the decompile cost is a
# one-time hit per toolchain version, so warm builds are unaffected.
org.gradle.workers.max=4
org.gradle.configureondemand=true
org.gradle.configuration-cache=false

loom.shareRemapCaches=true

# The single source of truth for the mod version when CI does not inject -PsemVer (GitVersion).
# Consumed by resolveSemVer() in the convention plugins and by :core / :paper.
# IMPORTANT: this value's major.minor is what becomes the upstream API path segment
# (/api/v<major>.<minor>/...), so it must track the API version the relay actually serves.
localSemVer=0.3.0-dev
