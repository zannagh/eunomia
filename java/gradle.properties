org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false

loom.shareRemapCaches=true

# The single source of truth for the mod version when CI does not inject -PsemVer (GitVersion).
# Consumed by resolveSemVer() in the convention plugins and by :core / :paper.
# IMPORTANT: this value's major.minor is what becomes the upstream API path segment
# (/api/v<major>.<minor>/...), so it must track the API version the relay actually serves.
localSemVer=0.3.0-dev
