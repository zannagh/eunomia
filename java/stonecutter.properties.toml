display_version = "mc-26.1.0-2"
game_versions = "26.1,26.1.1,26.1.2"

["26.2"]
java.version = "25"
display_version = "26.2"
game_versions = "26.2"
# To enable the FCGT (fabric-client-gametest-api-v1) networking smoke on a variant, set
# `fabricapi.semver` here (the fabric-api version for that MC, e.g. "0.153.0+26.2"). Presence of the
# property flips the `fcgt` stonecutter constant, the FCGT deps, the gametest entrypoint and the
# `runClientGametest` task on. Left off on this deobf variant - see the smoke README for the caveat.

["26.3-snapshot-9"]
java.version = "25"
display_version = "26.3-snap.9"
game_versions = "26.3-snapshot-9"

# ──────────────────────────────────────────────────────────────────────────────
# Per project - loader-specific properties.
# Matched via the default project tag (e.g. "fabric-1.20.1").
#
# IMPORTANT: fabric.* and neoforge.* keys MUST be quoted ("fabric.xxx") to
# prevent the branch tag from stripping the first segment during path cutting.
# ──────────────────────────────────────────────────────────────────────────────

