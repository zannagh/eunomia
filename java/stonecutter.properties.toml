# Global properties
maven_group = "de.zannagh.eunomia"
archives_base_name = "eunomia"
loader_version = "0.18.4"

# ──────────────────────────────────────────────────────────────────────────────
# Per MC version - shared between fabric and neoforge for the same game version.
# Matched via a custom "version" tag added in multiloader-common.gradle.kts.
# ──────────────────────────────────────────────────────────────────────────────

["1.20.1"]
java.version = "17"
display_version = "mc-1.20.0-1"
game_versions = "1.20,1.20.1"

["1.21.1"]
java.version = "21"
display_version = "mc-1.21.0-1"
game_versions = "1.21,1.21.1"

