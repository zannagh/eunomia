# ──────────────────────────────────────────────────────────────────────────────
# Per project - loader-specific properties.
# Matched via the default project tag (e.g. "fabric-1.20.1").
#
# IMPORTANT: fabric.* and neoforge.* keys MUST be quoted ("fabric.xxx") to
# prevent the branch tag from stripping the first segment during path cutting.
# ──────────────────────────────────────────────────────────────────────────────

# ── Fabric ────────────────────────────────────────────────────────────────────

# `fabricapi.semver` (the fabric-api version for that MC) is the single switch for the FCGT
# (fabric-client-gametest-api-v1) client gametest: its presence flips the `fcgt` stonecutter
# constant, the FCGT compile dep, the `fabric-client-gametest` entrypoint list, the run/mods
# provisioning (`copyFcgtToMods`) and the `runClientGametest` task on. It MUST live in the
# ["fabric-<mc>"] section, not the bare ["<mc>"] one - :smoke's FcgtSmokeTest discovers enabled
# variants by scanning for fabric sections that carry the key.
#
# Only the Modrinth *hash* flavour (`fabricapi.version`) is deliberately absent: eunomia declares
# no compat mods and has no compat-jar fetch machinery, so a hash here would be dead config.

["fabric-1.20.1"]
"fabric.minecraft_version" = "1.20.1"
"fabric.minecraft_version_range" = ">=1.20 <=1.20.1"
# The fabric-api line for this MC predates fabric-client-gametest-api-v1 - the FCGT smoke
# cannot be wired here. `fabricapi.semver` is intentionally omitted; do not "helpfully" add it.

["fabric-1.21.1"]
"fabric.minecraft_version" = "1.21.1"
"fabric.minecraft_version_range" = ">=1.21 <=1.21.1"
# The fabric-api line for this MC predates fabric-client-gametest-api-v1 - the FCGT smoke
# cannot be wired here. `fabricapi.semver` is intentionally omitted; do not "helpfully" add it.

