# Local/dev stack for the Eunomia C# server: Postgres, the app, and an Aspire OTLP dashboard.
#
# Passwords here are dev placeholders only - override POSTGRES__PASSWORD (and the postgres
# POSTGRES_PASSWORD) with real secrets via a gitignored .env or your deployment's secret store
# before exposing this anywhere. Bring it up from the csharp/ directory: `docker compose up -d`.
#
# Secrets for the `eunomia` service are passed through from the environment of whoever runs
# `docker compose` - either your shell (the dotfiles `export-bw-env-vars.sh` exports them from
# Bitwarden) or a gitignored csharp/.env. See the `eunomia` service's environment block.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: eunomia
      POSTGRES_USER: postgres
      # Kept in sync with the app's POSTGRES__PASSWORD; override both from the same host var.
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-eunomia_dev}
    ports:
      - "5432:5432"
    volumes:
      - eunomia-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Not for a public endpoint: DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS drops the login token and
  # OTLP auth so it "just works" on the internal network. Traces/metrics are kept in-memory (a rolling
  # window) - handy for ad-hoc debugging, gone on restart.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # web UI — open http://localhost:18888
      - "18889:18889"   # OTLP/gRPC ingest
    restart: unless-stopped

  eunomia:
    # Runs the published image so the deploy-hook can pull newer versions on release. To run a local
    # build instead, comment out `image:` and uncomment the `build:` block below.
    image: ghcr.io/zannagh/eunomia/eunomia-server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Fixed for the containerized stack.
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_SERVICE_NAME=Eunomia
      - POSTGRES__HOST=postgres
      - POSTGRES__PORT=5432
      - POSTGRES__DATABASE=eunomia
      - POSTGRES__USERNAME=postgres
      - POSTGRES__PASSWORD=${POSTGRES__PASSWORD:-eunomia_dev}
      # Secrets passed through from the host environment (your shell - exported by the dotfiles
      # scripts/export-bw-env-vars.sh from Bitwarden - or a gitignored csharp/.env). Bare-key
      # form: each var is injected ONLY if it is set on the host; if unset it is omitted so the
      # image's appsettings.*.json stays the fallback (an empty value would otherwise clobber it).
      # `__` is the .NET config separator, e.g. Eunomia__JwtKey overrides Eunomia:JwtKey.
      - GITHUB_TOKEN
      - Eunomia__JwtKey
      - Eunomia__GitHubOAuth__Enabled
      - Eunomia__GitHubOAuth__ClientId
      - Eunomia__GitHubOAuth__ClientSecret
      - Eunomia__GoogleOAuth__Enabled
      - Eunomia__GoogleOAuth__ClientId
      - Eunomia__GoogleOAuth__ClientSecret
      - Eunomia__MicrosoftOAuth__Enabled
      - Eunomia__MicrosoftOAuth__ClientId
      - Eunomia__MicrosoftOAuth__ClientSecret
      - Eunomia__ModrinthOAuth__Enabled
      - Eunomia__ModrinthOAuth__ClientId
      - Eunomia__ModrinthOAuth__ClientSecret
      - Eunomia__DiscordOAuth__Enabled
      - Eunomia__DiscordOAuth__ClientId
      - Eunomia__DiscordOAuth__ClientSecret
    volumes:
      # Persist the DataProtection key ring across redeploys (written by the auth layer) so a deploy
      # no longer logs everyone out / breaks in-flight logins.
      - ./dpkeys:/app/keys
    depends_on:
      - postgres
      - aspire-dashboard
    restart: unless-stopped

  # Receives the GitHub releases/packages webhook and, on a new published image, pulls and recreates
  # the eunomia service. See deploy-hook/ (and deploy-hook/.env.example for the required vars).
  # SECURITY: this drives the host docker daemon via the mounted socket, so it is effectively root on
  # the host. It only acts on webhooks whose HMAC matches WEBHOOK_SECRET — keep that secret strong and
  # never expose /ci/released publicly without it.
  deploy-hook:
    build:
      context: ./deploy-hook
    image: eunomia-deploy-hook:local
    ports:
      - "${DEPLOY_HOOK_PORT:-9000}:9000"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in csharp/.env and in the GitHub webhook}
      COMPOSE_DIR: ${COMPOSE_DIR:?set COMPOSE_DIR in csharp/.env to this dir's absolute host path}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-eunomia}
      DEPLOY_SERVICE: eunomia
      # GHCR login for a PRIVATE package. Give it a read:packages token. Leave empty if public.
      GHCR_USER: ${GHCR_USER:-zannagh}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    volumes:
      # Drive the host docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path mount so `docker compose` inside resolves the stack's relative bind mounts to the
      # identical host paths the daemon expects.
      - ${COMPOSE_DIR}:${COMPOSE_DIR}
    restart: unless-stopped

volumes:
  eunomia-pgdata:
