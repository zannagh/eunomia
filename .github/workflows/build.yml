# Build validation for pull requests: compile every loader variant, run the Tier-1 unit tests with
# merged coverage, and stage the artifacts. NO uploads to mod platforms (eunomia is not published);
# maven publishing lives in publish-maven.yml.
#
# The Gradle build lives under java/, so gradle steps set working-directory: java and artifact/report
# paths are prefixed with java/.

name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Opt in to Gradle build scans (gated on this var in settings.gradle.kts).
env:
  EUNOMIA_BUILD_SCAN_PUBLISH: "true"

jobs:
  runner-and-version:
    name: Determine Runner & Get Version
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
    steps:
      - name: Pick a runner
        id: pick
        uses: zannagh/versionizer/determine-runner@v1
        with:
          # Fine-grained PAT with Administration:read on this repo (lists runners). Missing/invalid
          # token degrades gracefully to default-runs-on.
          runner-token: ${{ secrets.RUNNER_TOKEN }}
          required-labels: 'Linux,X64,build'
          default-runs-on: 'ubuntu-latest'
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        uses: zannagh/versionizer/calculate-version@v1

  build:
    name: Build & Test
    needs: runner-and-version
    runs-on: ${{ fromJSON(needs.runner-and-version.outputs.runner) }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
        with:
          gradlew-path: "./java/gradlew"

      # Runs :core:test + :paper:test + the active :common:<variant>:test and merges them into one
      # JaCoCo report (mixins excluded). The Tier-3 client-spawning suite lives in its own `smokeTest`
      # task and is never reachable from here.
      - name: Unit tests + coverage
        run: ./gradlew aggregatedCoverage

      - name: Coverage summary (PR comment)
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/java/build/reports/jacoco/aggregate/jacocoAggregate.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          update-comment: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ needs.runner-and-version.outputs.fullSemVer }}
          path: 'java/**/build/reports/jacoco/**'
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: java/build/reports/jacoco/aggregate/jacocoAggregate.xml
          flags: java
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build & Stage Artifacts
        run: ./gradlew stageArtifacts -PsemVer="${{ needs.runner-and-version.outputs.fullSemVer }}" -Pprerelease="true"

      - name: Upload Staged Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: eunomia-${{ needs.runner-and-version.outputs.fullSemVer }}
          path: java/staging/*.jar
          if-no-files-found: warn
