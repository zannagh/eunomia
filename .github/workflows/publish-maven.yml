# Publishes eunomia's maven artifacts to the self-hosted Reposilite (https://maven.zannagh.me/releases,
# anonymous read) so a sibling mod can consume them without any token:
#   - de.zannagh.eunomia:eunomia-core   (the MC-free networking/framework library)
#   - de.zannagh.eunomia:eunomia-paper  (the shaded Paper plugin)
#   - de.zannagh.eunomia:eunomia-common (one jar per game version, as `<semVer>+<display_version>`)
#
# Backfill: run this workflow manually (workflow_dispatch) with `tag` set to an existing release tag,
# e.g. v0.3.15. That tag is checked out and published under its own version. A tag cut before the
# Reposilite move still carries the old GitHub Packages publish config, so the backfill overlays the
# publish config from the commit the workflow runs from (see "Overlay publish config").
#
# Credentials: the MAVEN_USERNAME / MAVEN_PASSWORD repository secrets, read by the eunomia-publish
# convention from the environment. Nothing needs `packages: write` any more.
#
# This workflow publishes the Maven artifacts only. Consumer-facing mod uploads to Modrinth and
# CurseForge (Fabric/NeoForge) live in publish-platforms.yml, driven by a manual GitHub release.
#
# eunomia-common is game-version-specific and only the ACTIVE stonecutter variant registers a
# publication, so the whole matrix is covered by switching the active variant once per game version
# (the `publish-common` job below). Before that job existed only the default active variant (26.2) was
# ever published, which left a consumer unable to resolve eunomia-common on any other game version.
#
# The coordinate is `<semVer>+<display_version>`, so the matrix must contain each display_version
# EXACTLY ONCE. fabric-X and neoforge-X share a display_version, so only the FABRIC variant of each
# game version is listed: the common jar is loader-agnostic and a NeoForge consumer resolves the
# fabric-built jar and compiles against it fine.
#
# forge-1.20.1 is the one exception and IS listed. Classic Forge deliberately overrides
# display_version to "mc-1.20.1-forge" (see stonecutter.properties.toml) rather than sharing
# fabric-1.20.1's "mc-1.20.0-1", because its jar is genuinely different - it is built against Forge
# 47.x with Mixin 0.8.5 rather than against Fabric - so it claims its own coordinate and collides
# with nothing.

name: Publish (Maven)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (backfill), e.g. v0.3.15"
        required: true
        type: string
  release:
    types: [published]

env:
  EUNOMIA_BUILD_SCAN_PUBLISH: "true"

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Empty on a release event (checks out the release tag); the backfill tag on dispatch.
          ref: ${{ inputs.tag }}

      - name: Calculate Version
        id: calc
        uses: zannagh/versionizer/calculate-version@v1

      # On a backfill the version is the tag itself, so it cannot drift from what was released.
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          CALCULATED: ${{ steps.calc.outputs.fullSemVer }}
        run: |
          if [ -n "$TAG" ]; then
            echo "fullSemVer=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "fullSemVer=$CALCULATED" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish libraries (core, paper, conventions)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Empty on a release event (checks out the release tag); the backfill tag on dispatch.
          ref: ${{ inputs.tag }}

      # Backfill only: the tag predates the Reposilite move, so lay the current publish convention over
      # it. Harmless on a release event, where it is skipped.
      - name: Checkout publish config
        if: ${{ inputs.tag != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-publish-config
          sparse-checkout: |
            java/buildSrc/src/main/kotlin/eunomia-publish.gradle.kts
            java/gradle-conventions/src/main/kotlin/eunomia-publish.gradle.kts
            java/gradle-conventions/build.gradle.kts

      - name: Overlay publish config
        if: ${{ inputs.tag != '' }}
        working-directory: .
        run: |
          for f in java/buildSrc/src/main/kotlin/eunomia-publish.gradle.kts \
                   java/gradle-conventions/src/main/kotlin/eunomia-publish.gradle.kts \
                   java/gradle-conventions/build.gradle.kts; do
            cp ".ci-publish-config/$f" "$f"
          done

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
        with:
          gradlew-path: "./java/gradlew"

      # The eunomia-publish convention reads MAVEN_USERNAME/MAVEN_PASSWORD for the Reposilite repo.
      # Explicit project paths: a bare `publish` would also publish whichever common variant happens
      # to be active, duplicating a coordinate the publish-common matrix owns.
      - name: Publish libraries
        run: ./gradlew :core:publish :paper:publish -PsemVer="${{ needs.version.outputs.fullSemVer }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      # Also publish the shared multiloader/stonecutter convention plugins (standalone build) so a
      # consumer can apply the same setup as a resolved plugin instead of copying buildSrc.
      - name: Publish convention plugins
        run: ./gradlew -p gradle-conventions publish -PsemVer="${{ needs.version.outputs.fullSemVer }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

  publish-common:
    name: Publish eunomia-common (${{ matrix.variant }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One game version's failure must not hide the other ten.
      fail-fast: false
      # Each variant is a full stonecutter switch plus a compile; three at a time without serialising
      # the whole matrix.
      max-parallel: 3
      matrix:
        # One entry per display_version (see stonecutter.properties.toml). Fabric only, plus the
        # classic-Forge variant that owns its own display_version - see header.
        variant:
          - fabric-1.20.1
          - fabric-1.21.1
          - fabric-1.21.2
          - fabric-1.21.3
          - fabric-1.21.4
          - fabric-1.21.8
          - fabric-1.21.10
          - fabric-1.21.11
          - fabric-26.1.2
          - fabric-26.2
          - fabric-26.3
          - fabric-26.4-snapshot-10
          # Classic Forge (LexForge), 1.20.1 only - NeoForge covers 1.20.2+. Publishes
          # eunomia-common:<semVer>+mc-1.20.1-forge.
          - forge-1.20.1
    defaults:
      run:
        shell: bash
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Empty on a release event (checks out the release tag); the backfill tag on dispatch.
          ref: ${{ inputs.tag }}

      # Backfill only: the tag predates the Reposilite move, so lay the current publish convention over
      # it. Harmless on a release event, where it is skipped.
      - name: Checkout publish config
        if: ${{ inputs.tag != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci-publish-config
          sparse-checkout: |
            java/buildSrc/src/main/kotlin/eunomia-publish.gradle.kts
            java/gradle-conventions/src/main/kotlin/eunomia-publish.gradle.kts
            java/gradle-conventions/build.gradle.kts

      - name: Overlay publish config
        if: ${{ inputs.tag != '' }}
        working-directory: .
        run: |
          for f in java/buildSrc/src/main/kotlin/eunomia-publish.gradle.kts \
                   java/gradle-conventions/src/main/kotlin/eunomia-publish.gradle.kts \
                   java/gradle-conventions/build.gradle.kts; do
            cp ".ci-publish-config/$f" "$f"
          done

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
        with:
          gradlew-path: "./java/gradlew"

      # Stonecutter rewrites the sources in place, so the switch must be its own invocation - the
      # publish below has to configure against the already-switched tree.
      - name: Set active variant
        run: ./gradlew "Set active project to ${{ matrix.variant }}"

      - name: Publish eunomia-common
        run: ./gradlew :common:${{ matrix.variant }}:publish -PsemVer="${{ needs.version.outputs.fullSemVer }}"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
