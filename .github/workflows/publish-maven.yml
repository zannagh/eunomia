# Publishes eunomia's maven artifacts to GitHub Packages so a sibling mod can consume them:
#   - de.zannagh.eunomia:eunomia-core   (the MC-free networking/framework library)
#   - de.zannagh.eunomia:eunomia-paper  (the shaded Paper plugin)
#   - de.zannagh.eunomia:eunomia-common (one jar per game version, as `<semVer>+<display_version>`)
#
# This workflow publishes the Maven artifacts only. Consumer-facing mod uploads to Modrinth and
# CurseForge (Fabric/NeoForge) live in publish-platforms.yml, driven by a manual GitHub release.
#
# eunomia-common is game-version-specific and only the ACTIVE stonecutter variant registers a
# publication, so the whole matrix is covered by switching the active variant once per game version
# (the `publish-common` job below). Before that job existed only the default active variant (26.2) was
# ever published, which left a consumer unable to resolve eunomia-common on any other game version.
#
# The coordinate is `<semVer>+<display_version>`, so the matrix must contain each display_version
# EXACTLY ONCE. fabric-X and neoforge-X share a display_version, so only the FABRIC variant of each
# game version is listed: the common jar is loader-agnostic and a NeoForge consumer resolves the
# fabric-built jar and compiles against it fine.
#
# forge-1.20.1 is the one exception and IS listed. Classic Forge deliberately overrides
# display_version to "mc-1.20.1-forge" (see stonecutter.properties.toml) rather than sharing
# fabric-1.20.1's "mc-1.20.0-1", because its jar is genuinely different - it is built against Forge
# 47.x with Mixin 0.8.5 rather than against Fabric - so it claims its own coordinate and collides
# with nothing.

name: Publish (Maven)

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  EUNOMIA_BUILD_SCAN_PUBLISH: "true"

jobs:
  runner-and-version:
    name: Determine Runner & Get Version
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
    steps:
      - name: Pick a runner
        id: pick
        uses: zannagh/versionizer/determine-runner@v1
        with:
          # Fine-grained PAT with Administration:read on this repo (lists runners). Missing/invalid
          # token degrades gracefully to default-runs-on.
          runner-token: ${{ secrets.RUNNER_TOKEN }}
          required-labels: 'Linux,X64,build'
          default-runs-on: 'ubuntu-latest'
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        uses: zannagh/versionizer/calculate-version@v1

  publish:
    name: Publish libraries (core, paper, conventions)
    needs: runner-and-version
    runs-on: ${{ fromJSON(needs.runner-and-version.outputs.runner) }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
        with:
          gradlew-path: "./java/gradlew"

      # The eunomia-publish convention reads GITHUB_ACTOR/GITHUB_TOKEN for the GitHub Packages repo.
      # Explicit project paths: a bare `publish` would also publish whichever common variant happens
      # to be active, duplicating a coordinate the publish-common matrix owns.
      - name: Publish libraries
        run: ./gradlew :core:publish :paper:publish -PsemVer="${{ needs.runner-and-version.outputs.fullSemVer }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also publish the shared multiloader/stonecutter convention plugins (standalone build) so a
      # consumer can apply the same setup as a resolved plugin instead of copying buildSrc.
      - name: Publish convention plugins
        run: ./gradlew -p gradle-conventions publish -PsemVer="${{ needs.runner-and-version.outputs.fullSemVer }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-common:
    name: Publish eunomia-common (${{ matrix.variant }})
    needs: runner-and-version
    runs-on: ${{ fromJSON(needs.runner-and-version.outputs.runner) }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One game version's failure must not hide the other ten.
      fail-fast: false
      # Each variant is a full stonecutter switch plus a compile; three at a time keeps the peak off a
      # self-hosted runner without serialising the whole matrix.
      max-parallel: 3
      matrix:
        # One entry per display_version (see stonecutter.properties.toml). Fabric only, plus the
        # classic-Forge variant that owns its own display_version - see header.
        variant:
          - fabric-1.20.1
          - fabric-1.21.1
          - fabric-1.21.2
          - fabric-1.21.3
          - fabric-1.21.4
          - fabric-1.21.8
          - fabric-1.21.10
          - fabric-1.21.11
          - fabric-26.1.2
          - fabric-26.2
          - fabric-26.3
          # Classic Forge (LexForge), 1.20.1 only - NeoForge covers 1.20.2+. Publishes
          # eunomia-common:<semVer>+mc-1.20.1-forge.
          - forge-1.20.1
    defaults:
      run:
        shell: bash
        working-directory: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Gradle Environment
        uses: zannagh/versionizer/setup-gradle-env@v1
        with:
          gradlew-path: "./java/gradlew"

      # Stonecutter rewrites the sources in place, so the switch must be its own invocation - the
      # publish below has to configure against the already-switched tree.
      - name: Set active variant
        run: ./gradlew "Set active project to ${{ matrix.variant }}"

      - name: Publish eunomia-common
        run: ./gradlew :common:${{ matrix.variant }}:publish -PsemVer="${{ needs.runner-and-version.outputs.fullSemVer }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
